# Keeps the feature library up to date from issues:
#  - "Share a feature" issue + a maintainer adds the label "approved"  -> feature added to library/
#  - "Share a factory file" issue + label "approved"                     -> added to factory-data/ and
#    compared with the other cars; proposed features appear in factory-data/<make>/<model>/proposed/
#  - "Works on my car" issue                                           -> confirmation counted
# Issue text is untrusted: it's passed through an environment variable into a file and only
# ever read as data by tools/library_tool.py - never pasted into a shell command.
name: Feature library

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: feature-library
  cancel-in-progress: false

jobs:
  add-feature:
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'feature-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Add to library
        id: add
        env:
          BODY: ${{ github.event.issue.body }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/issue.md"
          set +e
          python tools/library_tool.py add "$RUNNER_TEMP/issue.md" "$ISSUE" > "$RUNNER_TEMP/result.txt"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/result.txt"
      - name: Commit
        if: steps.add.outputs.code == '0'
        run: |
          git config user.name "hatchling-library[bot]"
          git config user.email "hatchling-library@users.noreply.github.com"
          git add library
          git commit -m "Library: add feature from #${{ github.event.issue.number }}"
          git pull --rebase && git push
      - name: Reply
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          CODE: ${{ steps.add.outputs.code }}
        run: |
          if [ "$CODE" = "0" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Added to the library - thanks! It'll show in Hatchling's Library page on the next refresh. ($(cat "$RUNNER_TEMP/result.txt"))"
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Couldn't add this feature: $(cat "$RUNNER_TEMP/result.txt" 2>/dev/null || echo 'see the workflow log'). Please fix it and share again."
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label approved
          fi

  add-factory-file:
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'factory-file')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Add factory file and compare
        id: add
        env:
          BODY: ${{ github.event.issue.body }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/issue.md"
          set +e
          python tools/library_tool.py factory-add "$RUNNER_TEMP/issue.md" "$ISSUE" > "$RUNNER_TEMP/result.txt"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then python tools/library_tool.py suggest >> "$RUNNER_TEMP/result.txt"; fi
          cat "$RUNNER_TEMP/result.txt"
      - name: Commit
        if: steps.add.outputs.code == '0'
        run: |
          git config user.name "hatchling-library[bot]"
          git config user.email "hatchling-library@users.noreply.github.com"
          git add factory-data
          git commit -m "Factory data: add file from #${{ github.event.issue.number }}"
          git pull --rebase && git push
      - name: Reply
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          CODE: ${{ steps.add.outputs.code }}
        run: |
          if [ "$CODE" = "0" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Thanks - added to the factory data. $(cat "$RUNNER_TEMP/result.txt")"
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Couldn't add this file: $(cat "$RUNNER_TEMP/result.txt" 2>/dev/null || echo 'see the workflow log')"
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label approved
          fi

  confirm-feature:
    if: github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'confirmation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Count confirmation
        id: conf
        env:
          BODY: ${{ github.event.issue.body }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/issue.md"
          set +e
          python tools/library_tool.py confirm "$RUNNER_TEMP/issue.md" "$LOGIN" > "$RUNNER_TEMP/result.txt"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/result.txt"
      - name: Commit
        if: steps.conf.outputs.code == '0'
        run: |
          git config user.name "hatchling-library[bot]"
          git config user.email "hatchling-library@users.noreply.github.com"
          git add library
          git diff --cached --quiet || { git commit -m "Library: confirmation from #${{ github.event.issue.number }}" && git pull --rebase && git push; }
      - name: Reply
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          CODE: ${{ steps.conf.outputs.code }}
        run: |
          if [ "$CODE" = "0" ]; then MSG="Thanks - counted. ($(cat "$RUNNER_TEMP/result.txt"))"; else MSG="Couldn't count this: $(cat "$RUNNER_TEMP/result.txt" 2>/dev/null)"; fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$MSG"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
