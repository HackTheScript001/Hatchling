# Tests Hatchling on Windows and Linux (Intel and ARM / Raspberry Pi), then builds the Windows installer and
# the Linux release, and publishes them together.
#  - Every push / manual run: installer uploaded as a build artifact.
#  - The first build of a new version (VERSION in core/version.py) is published as a GitHub
#    release with its tag, e.g. v1.0.1, plus a .sha256 checksum - the in-app updater downloads
#    the installer, checks it against the checksum and installs it silently.
#  - Before anything is built, tests/ clicks through every screen against the simulator. If anything
#    crashes the build stops, so no release goes out with a broken screen.
#  - Code signing: add the repository secrets SIGN_PFX (the .pfx certificate, base64) and
#    SIGN_PFX_PASSWORD and the app and installer are signed. Without them the build is unsigned. To release an
#    update: bump VERSION, update RELEASE_NOTES.md, push.
name: Build Hatchling installer

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Core tests (simulator)
        run: python tests/test_core.py
      - name: Screen tests (every page against the simulator)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_ui.py

  linux-installer:
    name: Linux installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 22.04 is close to Raspberry Pi OS Bookworm (Python 3.10/3.11, older glibc); the ARM runners are Pi-like
        os: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run install-linux.sh with the system Python
        run: ./install-linux.sh
      - name: The installed copy opens every screen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test -x "$HOME/.local/bin/hatchling"
          test -L "$HOME/.local/share/hatchling/current"
          "$HOME/.local/share/hatchling/venv/bin/python" tests/test_ui.py
      - name: Uninstall
        run: ./install-linux.sh --uninstall && test ! -e "$HOME/.local/share/hatchling"

  linux-package:
    needs: [tests, linux-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack the Linux release
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' core/version.py)
          mkdir -p dist
          git archive --format=tar.gz --prefix="hatchling-$v/" -o "dist/Hatchling-linux-$v.tar.gz" HEAD
          cp "dist/Hatchling-linux-$v.tar.gz" dist/Hatchling-linux.tar.gz
          cd dist && for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  build:
    needs: [tests, linux-installer]
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.SIGN_PFX != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path core/version.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}".TrimStart("v") -ne $v) {
            Write-Error "Tag ${{ github.ref_name }} doesn't match VERSION $v in core/version.py"; exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Refresh bundled library index
        run: python tools/library_tool.py index

      - name: Build app
        run: >
          pyinstaller --noconfirm --windowed --name Hatchling --icon assets/hatchling.ico
          --add-data "assets;assets" --add-data "features;features" --add-data "services;services"
          --add-data "livedata;livedata" --add-data "vehicles;vehicles" --add-data "library;library" --add-data "data;data" main.py

      - name: Sign the app (when a certificate is set up)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          SIGN_PFX: ${{ secrets.SIGN_PFX }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\Hatchling\Hatchling.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} installer\hatchling.iss'
        shell: pwsh

      - name: Sign the installer (when a certificate is set up)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          $exe = Get-ChildItem dist/Hatchling-Setup-*.exe | Select-Object -First 1
          & $env:SIGNTOOL sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item $pfx

      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/Hatchling-Setup-*.exe | Select-Object -First 1
          "$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower())  $($exe.Name)" | Set-Content -NoNewline -Encoding ascii "$($exe.FullName).sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Hatchling-Setup-*

  publish:
    # the first build of a new version on main becomes the release (Windows installer + Linux files)
    needs: [build, linux-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' core/version.py)
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$v already exists - nothing to publish."; exit 0
          fi
          ls -l dist
          gh release create "v$v" dist/Hatchling-Setup-*.exe dist/Hatchling-Setup-*.exe.sha256 \
            dist/Hatchling-linux-*.tar.gz dist/Hatchling-linux-*.tar.gz.sha256 \
            dist/Hatchling-linux.tar.gz dist/Hatchling-linux.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Hatchling $v" --notes-file RELEASE_NOTES.md
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/v$v"
