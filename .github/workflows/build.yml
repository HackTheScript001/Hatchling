# Builds Hatchling.exe and the installer on Windows.
#  - Every push / manual run: installer uploaded as a build artifact.
#  - The first build of a new version (VERSION in core/version.py) is published as a GitHub
#    release with its tag, e.g. v1.0.1, plus a .sha256 checksum - the in-app updater downloads
#    the installer, checks it against the checksum and installs it silently.
#  - Before anything is built, tests/ clicks through every screen against the simulator. If anything
#    crashes the build stops, so no release goes out with a broken screen.
#  - Code signing: add the repository secrets SIGN_PFX (the .pfx certificate, base64) and
#    SIGN_PFX_PASSWORD and the app and installer are signed. Without them the build is unsigned. To release an
#    update: bump VERSION, update RELEASE_NOTES.md, push.
name: Build Hatchling installer

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.SIGN_PFX != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Core tests (simulator)
        run: python tests/test_core.py

      - name: Screen tests (every page against the simulator)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_ui.py

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path core/version.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}".TrimStart("v") -ne $v) {
            Write-Error "Tag ${{ github.ref_name }} doesn't match VERSION $v in core/version.py"; exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Refresh bundled library index
        run: python tools/library_tool.py index

      - name: Build app
        run: >
          pyinstaller --noconfirm --windowed --name Hatchling --icon assets/hatchling.ico
          --add-data "assets;assets" --add-data "features;features" --add-data "services;services"
          --add-data "livedata;livedata" --add-data "vehicles;vehicles" --add-data "library;library" --add-data "data;data" main.py

      - name: Sign the app (when a certificate is set up)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          SIGN_PFX: ${{ secrets.SIGN_PFX }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\Hatchling\Hatchling.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} installer\hatchling.iss'
        shell: pwsh

      - name: Sign the installer (when a certificate is set up)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          $exe = Get-ChildItem dist/Hatchling-Setup-*.exe | Select-Object -First 1
          & $env:SIGNTOOL sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item $pfx

      - uses: actions/upload-artifact@v4
        with:
          name: Hatchling-Setup-${{ steps.ver.outputs.version }}
          path: dist/Hatchling-Setup-*.exe

      - name: Publish release (first build of a new version)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          gh release view "v$env:VER" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release v$env:VER already exists - nothing to publish."; exit 0 }
          $exe = Get-ChildItem dist/Hatchling-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "Installer not found"; exit 1 }
          # checksum next to the installer - the in-app updater checks every download against it
          $sum = "$($exe.FullName).sha256"
          "$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower())  $($exe.Name)" | Set-Content -NoNewline -Encoding ascii $sum
          gh release create "v$env:VER" $exe.FullName $sum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "Hatchling $env:VER" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Published https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$env:VER"
